# Security responsibilities: This template configures security controls
# following the AWS Shared Responsibility Model
# (https://aws.amazon.com/compliance/shared-responsibility-model/).
# AWS is responsible for security OF the cloud (managed service software,
# infrastructure, hardware). You are responsible for security IN the cloud,
# including reviewing log groups, rotating any provided TLS certificate,
# acting on Amazon Simple Queue Service (Amazon SQS) dead-letter queue messages, and managing operator
# AWS Identity and Access Management (AWS IAM) credentials. See docs/SECURITY.md for the full responsibilities split.

AWSTemplateFormatVersion: '2010-09-09'
Description: 'Patch Compliance Dashboard - Compute Stack (AWS Lambda, Application Load Balancer, Amazon EventBridge)'

Parameters:
  InfrastructureStackName:
    Type: String
    Description: Name of the infrastructure stack to import values from

  DataSyncBucketName:
    Type: String
    Description: Name of the existing DataSync bucket (READ-ONLY access)

  DashboardBucketName:
    Type: String
    Description: Name of the existing Dashboard bucket (READ-WRITE access)

  CertificateArn:
    Type: String
    Description: >-
      Security Requirement: The HTTPS listener requires a valid TLS
      certificate. This parameter accepts an AWS Certificate Manager
      (ACM) certificate ARN. For non-production environments,
      self-signed certificates may be used for testing purposes only;
      `setup-tls.sh` generates one and imports it into ACM as part of
      the sample deploy flow. For production deployments, use
      certificates issued by a trusted Certificate Authority, such as
      AWS Private Certificate Authority or your organization's PKI
      infrastructure, to provide proper certificate validation and
      trust chain verification.

Resources:
  #############################################
  # Encryption keys
  #############################################
  # Encryption Key Management: This template uses AWS-managed encryption
  # keys (e.g. aws/logs, aws/sqs) by default, which provide encryption at
  # rest with AWS-managed key rotation. Customer-managed AWS Key Management Service (AWS KMS) keys are
  # required when: (1) organizational security policies mandate customer
  # control over encryption key lifecycle, (2) compliance frameworks
  # require customer-managed key rotation schedules, or (3) audit
  # requirements necessitate customer-controlled key access logging.
  # Evaluate your security and compliance requirements to determine the
  # appropriate key management approach.
  #
  # The AWS-managed key default avoids the $1/month per-key AWS KMS
  # charge and the 7-day pending deletion window that a customer-managed
  # AWS KMS key would introduce on stack teardown.
  #
  # To switch to a customer-managed AWS KMS key, create the key
  # separately and pass its ARN to the resources below. Look for
  # `# Customer-managed key: <resource>` comments throughout this
  # template for the specific properties to edit:
  #
  #   - AWS Lambda Amazon CloudWatch Log Groups: add `KmsKeyId: <cmk-arn>`
  #   - Amazon SQS DLQs: replace `KmsMasterKeyId: alias/aws/sqs` with your
  #     customer-managed key ARN
  #
  # When using a customer-managed key, grant the following services in
  # the key policy:
  #   - logs.<region>.amazonaws.com (for Log Groups)
  #   - sqs.amazonaws.com (for DLQ message encryption)
  #   - events.amazonaws.com (for Amazon EventBridge delivery to the
  #     encrypted DLQ)

  #############################################
  # AWS Identity and Access Management (AWS IAM) Roles
  #############################################
  CacheLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # AWSLambdaVPCAccessExecutionRole includes the basic execution role
        # permissions plus ENI management required for VPC-attached Lambdas.
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # DataSync bucket: scope reads to the four Resource Data Sync prefixes actually used
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub 'arn:aws:s3:::${DataSyncBucketName}/AWS:PatchSummary/*'
                  - !Sub 'arn:aws:s3:::${DataSyncBucketName}/AWS:InstanceInformation/*'
                  - !Sub 'arn:aws:s3:::${DataSyncBucketName}/AWS:ComplianceItem/*'
                  - !Sub 'arn:aws:s3:::${DataSyncBucketName}/AWS:Tag/*'
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::${DataSyncBucketName}'
                Condition:
                  StringLike:
                    s3:prefix:
                      - 'AWS:PatchSummary/*'
                      - 'AWS:InstanceInformation/*'
                      - 'AWS:ComplianceItem/*'
                      - 'AWS:Tag/*'
              # Dashboard bucket: cache prefix only, reads and writes required for cache generation
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - !Sub 'arn:aws:s3:::${DashboardBucketName}/cache/*'
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::${DashboardBucketName}'
                Condition:
                  StringLike:
                    s3:prefix:
                      - 'cache/*'
        - PolicyName: DLQAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt CacheLambdaDLQ.Arn
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-cache-role'

  APILambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: S3ReadCache
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub 'arn:aws:s3:::${DashboardBucketName}/cache/*'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-api-role'

  FrontendLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: S3ReadFrontend
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub 'arn:aws:s3:::${DashboardBucketName}/frontend/*'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-frontend-role'

  #############################################
  # Lambda Functions
  #############################################
  CacheLambda:
    Type: AWS::Lambda::Function
    DependsOn: CacheLambdaLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-cache'
      Runtime: python3.11
      Handler: handler.handler
      Role: !GetAtt CacheLambdaRole.Arn
      Timeout: 900
      MemorySize: 2048
      ReservedConcurrentExecutions: 1  # prevent overlapping runs from racing on cache files
      Code:
        S3Bucket: !Ref DashboardBucketName
        S3Key: lambda/cache/handler.zip
      Environment:
        Variables:
          DATASYNC_BUCKET: !Ref DataSyncBucketName
          DASHBOARD_BUCKET: !Ref DashboardBucketName
      DeadLetterConfig:
        TargetArn: !GetAtt CacheLambdaDLQ.Arn
      TracingConfig:
        Mode: Active
      # VPC placement: Cache Lambda reaches S3 via the S3 Gateway Endpoint
      # in the private route table; no NAT or public egress.
      VpcConfig:
        SecurityGroupIds:
          - !ImportValue
            Fn::Sub: '${InfrastructureStackName}-LambdaSecurityGroupId'
        SubnetIds:
          - !ImportValue
            Fn::Sub: '${InfrastructureStackName}-PrivateSubnet1Id'
          - !ImportValue
            Fn::Sub: '${InfrastructureStackName}-PrivateSubnet2Id'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-cache'

  APILambda:
    Type: AWS::Lambda::Function
    DependsOn: APILambdaLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-api'
      Runtime: python3.11
      Handler: handler.handler
      Role: !GetAtt APILambdaRole.Arn
      Timeout: 120
      MemorySize: 512
      # Cap account-level blast radius. The dashboard is internal-only with a
      # small operator base, so realistic per-user demand is 1-2 concurrent
      # API requests; 25 leaves room for ~12 simultaneous operators while
      # protecting the rest of the account from a runaway client. See
      # docs/SECURITY.md "Compute hardening" and threat T26.
      ReservedConcurrentExecutions: 25
      Code:
        S3Bucket: !Ref DashboardBucketName
        S3Key: lambda/api/handler.zip
      Environment:
        Variables:
          DASHBOARD_BUCKET: !Ref DashboardBucketName
      VpcConfig:
        SecurityGroupIds:
          - !ImportValue
            Fn::Sub: '${InfrastructureStackName}-LambdaSecurityGroupId'
        SubnetIds:
          - !ImportValue
            Fn::Sub: '${InfrastructureStackName}-PrivateSubnet1Id'
          - !ImportValue
            Fn::Sub: '${InfrastructureStackName}-PrivateSubnet2Id'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-api'

  FrontendLambda:
    Type: AWS::Lambda::Function
    DependsOn: FrontendLambdaLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-frontend'
      Runtime: python3.11
      Handler: handler.handler
      Role: !GetAtt FrontendLambdaRole.Arn
      Timeout: 30
      MemorySize: 256
      # Higher than APILambda because a single fresh page load fans out to
      # ~6-8 parallel asset requests (HTML, JS chunks, CSS, fonts). 50 lets
      # ~6-8 operators load fresh dashboards simultaneously while still
      # protecting account-level blast radius. See threat T26.
      ReservedConcurrentExecutions: 50
      Code:
        S3Bucket: !Ref DashboardBucketName
        S3Key: lambda/frontend/handler.zip
      Environment:
        Variables:
          DASHBOARD_BUCKET: !Ref DashboardBucketName
      VpcConfig:
        SecurityGroupIds:
          - !ImportValue
            Fn::Sub: '${InfrastructureStackName}-LambdaSecurityGroupId'
        SubnetIds:
          - !ImportValue
            Fn::Sub: '${InfrastructureStackName}-PrivateSubnet1Id'
          - !ImportValue
            Fn::Sub: '${InfrastructureStackName}-PrivateSubnet2Id'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-frontend'

  #############################################
  # Amazon CloudWatch Log Groups
  #############################################
  # Explicit Log Groups let us control retention and (optionally) encryption
  # with a customer-managed AWS KMS key. Without these, AWS auto-creates
  # Log Groups with infinite retention and the AWS-owned key.
  #
  # Key management strategy: log groups use the AWS-managed key
  # (`aws/logs`) by default. Chosen because it (a) incurs no per-key
  # AWS KMS charges, (b) requires no key policy maintenance, and
  # (c) the operational metadata logged at INFO does not mandate
  # customer-controlled keys per the workload's data classification
  # (see docs/SECURITY.md).
  #
  # Customer-managed key: To encrypt with a customer-managed AWS KMS key,
  # add `KmsKeyId: <customer-managed-key-arn>` to each Log Group and
  # grant `logs.<region>.amazonaws.com` in the key policy.
  #
  # Retention is 90 days. Increase to 365 for audit-sensitive workloads
  # — see docs/SECURITY.md for the data classification driving this.
  CacheLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-cache'
      RetentionInDays: 90

  APILambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-api'
      RetentionInDays: 90

  FrontendLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-frontend'
      RetentionInDays: 90

  #############################################
  # Amazon SQS Dead-Letter Queues
  #############################################
  # Customer-managed key: To encrypt queues with a customer-managed AWS KMS
  # key, replace `KmsMasterKeyId: alias/aws/sqs` with your customer-managed
  # key ARN and grant `sqs.amazonaws.com` and `events.amazonaws.com` in the
  # key policy.
  CacheLambdaDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-cache-dlq'
      MessageRetentionPeriod: 1209600  # 14 days (max)
      KmsMasterKeyId: alias/aws/sqs
      KmsDataKeyReusePeriodSeconds: 300

  CacheEventBridgeDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-cache-event-dlq'
      MessageRetentionPeriod: 1209600
      KmsMasterKeyId: alias/aws/sqs
      KmsDataKeyReusePeriodSeconds: 300

  # Allow EventBridge to deliver failed events to the DLQ.
  CacheEventBridgeDLQPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref CacheEventBridgeDLQ
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt CacheEventBridgeDLQ.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt CacheRefreshRule.Arn

  #############################################
  # Lambda Permissions for ALB
  #############################################
  # Lambda permissions for ALB target group invocations.
  # SourceArn uses a wildcard for the target group name because the target
  # groups themselves are CFN-generated (see APITargetGroup / FrontendTargetGroup
  # comments). The principal restriction (elasticloadbalancing.amazonaws.com)
  # plus the account/region scoping in the ARN prevent cross-account abuse.
  APILambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref APILambda
      Action: lambda:InvokeFunction
      Principal: elasticloadbalancing.amazonaws.com
      SourceArn: !Sub 'arn:aws:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:targetgroup/*'

  FrontendLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref FrontendLambda
      Action: lambda:InvokeFunction
      Principal: elasticloadbalancing.amazonaws.com
      SourceArn: !Sub 'arn:aws:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:targetgroup/*'

  #############################################
  # Application Load Balancer (ALB) Access Log Bucket
  #############################################
  # Dedicated bucket for Application Load Balancer access logs. Separate
  # from the Dashboard bucket to keep log delivery permissions isolated.
  # The Dashboard bucket itself has server access logging configured in
  # bucket.yaml (DashboardAccessLogBucket).
  #
  # Customer-managed key: The Elastic Load Balancing (ELB) service only
  # supports server-side encryption with Amazon S3-managed keys (SSE-S3, AES-256) or SSE-KMS with the AWS-managed key
  # `aws/s3` for access-log buckets. Customer-managed AWS KMS keys are
  # not supported by ELB access log delivery as of this writing.
  # Note: this bucket intentionally does not declare LoggingConfiguration.
  # It is the destination for Application Load Balancer access logs.
  # Enabling server access logging on a log destination bucket creates
  # an infinite recursive log delivery loop — every delivered log object
  # generates a new log entry, which generates another, and so on. AWS
  # documentation explicitly warns against this pattern:
  #   https://docs.aws.amazon.com/AmazonS3/latest/userguide/ServerLogs.html
  # For additional forensic visibility, enable AWS CloudTrail data events on
  # this bucket — see docs/HARDENING.md recommendation #2.
  ALBAccessLogBucket:
    # ALB access logs are forensic data — keep the bucket across stack
    # lifecycles so an accidental `delete-stack` does not also wipe the
    # audit trail. The teardown script (`deploy.sh delete`) explicitly
    # empties and deletes this bucket as a separate step when the operator
    # actually wants it gone.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-alb-logs-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldLogs
            Status: Enabled
            ExpirationInDays: 90
            NoncurrentVersionExpirationInDays: 30

  # Required: the ELB service principal in the ALB's region must be granted
  # s3:PutObject on the log prefix. The regional account IDs are in the AWS
  # docs: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/enable-access-logging.html
  # Using the modern logdelivery.elasticloadbalancing.amazonaws.com principal
  # works in all supported regions.
  ALBAccessLogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ALBAccessLogBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowELBLogDelivery
            Effect: Allow
            Principal:
              Service: logdelivery.elasticloadbalancing.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${ALBAccessLogBucket.Arn}/AWSLogs/${AWS::AccountId}/*'
            Condition:
              ArnLike:
                aws:SourceArn: !Sub 'arn:aws:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:loadbalancer/*'
          - Sid: DenyUnencryptedTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt ALBAccessLogBucket.Arn
              - !Sub '${ALBAccessLogBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

  #############################################
  # Application Load Balancer
  #############################################
  InternalALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: ALBAccessLogBucketPolicy
    Properties:
      # Name omitted intentionally — let AWS CloudFormation generate a unique
      # name. ALB names are limited to 32 characters and must be unique
      # within the region per account; a generated name is shorter and
      # avoids collisions on parallel or repeated deployments.
      Scheme: internal
      Type: application
      LoadBalancerAttributes:
        - Key: access_logs.s3.enabled
          Value: 'true'
        - Key: access_logs.s3.bucket
          Value: !Ref ALBAccessLogBucket
        - Key: deletion_protection.enabled
          Value: 'false'
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'
      SecurityGroups:
        - !ImportValue
          Fn::Sub: '${InfrastructureStackName}-ALBSecurityGroupId'
      Subnets:
        - !ImportValue
          Fn::Sub: '${InfrastructureStackName}-PrivateSubnet1Id'
        - !ImportValue
          Fn::Sub: '${InfrastructureStackName}-PrivateSubnet2Id'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-alb'

  #############################################
  # Target Groups
  #############################################
  APITargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    DependsOn: APILambdaPermission
    Properties:
      # Name omitted — CFN-generated names fit the 32-char target group
      # limit and avoid collisions on redeploy. The Lambda permission
      # SourceArn below uses a wildcard suffix so the generated suffix
      # does not break the binding.
      TargetType: lambda
      Targets:
        - Id: !GetAtt APILambda.Arn
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-api-tg'

  FrontendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    DependsOn: FrontendLambdaPermission
    Properties:
      TargetType: lambda
      Targets:
        - Id: !GetAtt FrontendLambda.Arn
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-fe-tg'

  #############################################
  # ALB Listener and Rules
  #############################################
  # HTTPS:443 is the only listener. Traffic is TLS-terminated at the ALB
  # and forwarded to Lambda targets over the AWS internal network.
  # Modern TLS policy: TLS 1.3 preferred with TLS 1.2 fallback.
  HTTPSListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref InternalALB
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref FrontendTargetGroup

  # /api/* routing rule — separate from default action so frontend SPA
  # routing stays distinct from API traffic.
  APIListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HTTPSListener
      Priority: 1
      Conditions:
        - Field: path-pattern
          Values:
            - '/api/*'
      Actions:
        - Type: forward
          TargetGroupArn: !Ref APITargetGroup

  #############################################
  # EventBridge Rule for Cache Refresh
  #############################################
  CacheRefreshRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${AWS::StackName}-cache-refresh'
      Description: Trigger cache refresh every 30 minutes
      ScheduleExpression: 'rate(30 minutes)'
      State: ENABLED
      Targets:
        - Id: CacheLambdaTarget
          Arn: !GetAtt CacheLambda.Arn
          RetryPolicy:
            MaximumRetryAttempts: 2
            MaximumEventAgeInSeconds: 1800  # 30 minutes; matches schedule cadence
          DeadLetterConfig:
            Arn: !GetAtt CacheEventBridgeDLQ.Arn

  CacheLambdaEventPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CacheLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt CacheRefreshRule.Arn

  #############################################
  # Throttle alarms for capped Lambdas
  #############################################
  # APILambda and FrontendLambda each carry a ReservedConcurrentExecutions
  # cap (see Lambda definitions above for rationale). When the cap is hit,
  # ALB-fronted requests fail with HTTP 502 and the operator sees a broken
  # page with no useful error message. These alarms surface that condition
  # so the operations team can distinguish "concurrency cap reached" from
  # "Lambda code error" without reverse-engineering the cause from logs.
  #
  # The alarms publish to CloudWatch only by default. Wire an SNS topic to
  # AlarmActions if you want pages or email notifications.
  APILambdaThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-api-throttles'
      AlarmDescription: >-
        APILambda throttles indicate the ReservedConcurrentExecutions cap was
        reached. ALB returns HTTP 502 to operators when this happens. Raise
        the cap or investigate the traffic source.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref APILambda
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  FrontendLambdaThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-frontend-throttles'
      AlarmDescription: >-
        FrontendLambda throttles indicate the ReservedConcurrentExecutions cap
        was reached. ALB returns HTTP 502 and the React SPA fails to load.
        Raise the cap or investigate the traffic source.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref FrontendLambda
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  ALBDNSName:
    Description: Internal ALB DNS Name
    Value: !GetAtt InternalALB.DNSName
    Export:
      Name: !Sub '${AWS::StackName}-ALBDNSName'

  ALBArn:
    Description: Internal ALB ARN
    Value: !Ref InternalALB
    Export:
      Name: !Sub '${AWS::StackName}-ALBArn'

  CacheLambdaArn:
    Description: Cache Lambda Function ARN
    Value: !GetAtt CacheLambda.Arn
    Export:
      Name: !Sub '${AWS::StackName}-CacheLambdaArn'

  APILambdaArn:
    Description: API Lambda Function ARN
    Value: !GetAtt APILambda.Arn
    Export:
      Name: !Sub '${AWS::StackName}-APILambdaArn'

  FrontendLambdaArn:
    Description: Frontend Lambda Function ARN
    Value: !GetAtt FrontendLambda.Arn
    Export:
      Name: !Sub '${AWS::StackName}-FrontendLambdaArn'

  CacheRefreshRuleArn:
    Description: EventBridge Rule ARN for cache refresh
    Value: !GetAtt CacheRefreshRule.Arn
    Export:
      Name: !Sub '${AWS::StackName}-CacheRefreshRuleArn'
